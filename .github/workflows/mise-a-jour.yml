name: Mise à jour du terminal

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '7 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer les modules
        run: pip install -r requirements.txt

      - name: Collecter les données de marché
        run: |
          mkdir -p site
          cp index.html site/index.html
          python collecte.py site/data/donnees.json

      - name: Note de l'analyste IA (Groq)
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: node analyse.js site/data/donnees.json site/data/ia.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Signe de vie hebdomadaire
        if: github.event.schedule == '7 3 * * 1'
        run: |
          date -u > derniere-activite.txt
          git config user.name "mini-boss-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derniere-activite.txt
          git commit -m "Robot : signe de vie" && git push || true
